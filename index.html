<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>به‌روزرسانی سایت | BEHRAD M PLAYER</title>

<style>

/* =========================================================
   FONT
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap');


/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    overflow:hidden;

    background:#02040a;

    color:white;

    font-family:
        Vazirmatn,
        Tahoma,
        Arial,
        sans-serif;

    cursor:none;

}


/* =========================================================
   MAIN BACKGROUND
========================================================= */

.scene{

    position:fixed;

    inset:0;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 48%,
            rgba(0,200,255,.13),
            transparent 25%
        ),

        radial-gradient(
            circle at 15% 15%,
            rgba(0,90,255,.08),
            transparent 28%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(120,0,255,.09),
            transparent 30%
        ),

        #02040a;

}


/* =========================================================
   AMBIENT LIGHT
========================================================= */

.ambient{

    position:absolute;

    width:700px;
    height:700px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(0,210,255,.12),
            rgba(0,100,255,.04) 35%,
            transparent 70%
        );

    filter:blur(35px);

    animation:

        ambientPulse
        6s
        ease-in-out
        infinite;

}


@keyframes ambientPulse{

    0%,100%{
        opacity:.65;
        transform:
            translate(-50%,-50%)
            scale(.9);
    }

    50%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

}


/* =========================================================
   MOVING LIGHT CLOUDS
========================================================= */

.cloud{

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    filter:blur(90px);

    opacity:.08;

    pointer-events:none;

}


.cloud.one{

    background:#008cff;

    left:-180px;
    top:-150px;

    animation:
        cloudOne
        18s
        ease-in-out
        infinite;

}


.cloud.two{

    background:#7d35ff;

    right:-180px;
    bottom:-180px;

    animation:
        cloudTwo
        23s
        ease-in-out
        infinite;

}


@keyframes cloudOne{

    50%{
        transform:
            translate(
                300px,
                180px
            )
            scale(1.3);
    }

}


@keyframes cloudTwo{

    50%{
        transform:
            translate(
                -250px,
                -160px
            )
            scale(1.2);
    }

}


/* =========================================================
   STARFIELD
========================================================= */

#stars{

    position:absolute;

    inset:0;

    perspective:1000px;

}


.star{

    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#d9fbff;

    box-shadow:
        0 0 8px #00ddff;

    animation:
        starFly
        linear
        infinite;

}


@keyframes starFly{

    from{

        transform:
            translate3d(
                var(--sx),
                var(--sy),
                -900px
            )
            scale(.1);

        opacity:0;

    }

    15%{
        opacity:.8;
    }

    to{

        transform:
            translate3d(
                calc(var(--sx) * 1.8),
                calc(var(--sy) * 1.8),
                600px
            )
            scale(3);

        opacity:0;

    }

}


/* =========================================================
   3D GRID
========================================================= */

.grid{

    position:absolute;

    width:180%;

    height:85%;

    left:-40%;

    bottom:-35%;

    transform:

        perspective(500px)

        rotateX(62deg);

    background-image:

        linear-gradient(
            rgba(0,215,255,.09) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,215,255,.09) 1px,
            transparent 1px
        );

    background-size:
        55px 55px;

    mask-image:

        linear-gradient(
            to top,
            black,
            transparent
        );

    animation:
        gridMove
        5s
        linear
        infinite;

}


@keyframes gridMove{

    to{

        background-position:
            0 275px;

    }

}


/* =========================================================
   FINE GRID
========================================================= */

.fineGrid{

    position:absolute;

    inset:0;

    opacity:.12;

    background-image:

        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size:
        90px 90px;

}


/* =========================================================
   SCANLINES
========================================================= */

.scanlines{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:80;

    background:

        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.018) 4px
        );

}


/* =========================================================
   SCANNER
========================================================= */

.scanner{

    position:fixed;

    left:0;

    top:-10%;

    width:100%;

    height:2px;

    z-index:81;

    background:

        linear-gradient(
            90deg,
            transparent,
            #00eaff,
            white,
            #00eaff,
            transparent
        );

    box-shadow:

        0 0 12px #00eaff,
        0 0 35px #00eaff;

    opacity:.35;

    animation:

        scanner
        6s
        linear
        infinite;

}


@keyframes scanner{

    to{
        top:110%;
    }

}


/* =========================================================
   MOUSE LIGHT
========================================================= */

#mouseLight{

    position:fixed;

    width:550px;
    height:550px;

    pointer-events:none;

    z-index:5;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(0,220,255,.10),
            rgba(0,120,255,.035) 35%,
            transparent 70%
        );

    filter:blur(8px);

}


/* =========================================================
   MAIN
========================================================= */

.main{

    position:relative;

    z-index:20;

    width:100%;
    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;

}


/* =========================================================
   PANEL
========================================================= */

.panel{

    position:relative;

    width:min(
        1000px,
        94vw
    );

    min-height:650px;

    padding:
        38px
        50px
        42px;

    border-radius:32px;

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.015)
        );

    border:
        1px solid
        rgba(0,220,255,.20);

    backdrop-filter:
        blur(25px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(25px)
        saturate(140%);

    box-shadow:

        0 40px 120px
        rgba(0,0,0,.65),

        0 0 90px
        rgba(0,180,255,.07),

        inset 0 0 90px
        rgba(0,220,255,.025);

    transform-style:preserve-3d;

    transition:
        transform .16s
        ease-out;

}


/* animated border */

.panel::before{

    content:"";

    position:absolute;

    inset:-1px;

    border-radius:33px;

    padding:1px;

    background:

        conic-gradient(
            from 0deg,
            transparent,
            #00eaff,
            transparent 18%,
            transparent 55%,
            #8b5cff,
            transparent 75%
        );

    mask:

        linear-gradient(#000 0 0)
        content-box,

        linear-gradient(#000 0 0);

    mask-composite:exclude;

    animation:

        borderSpin
        8s
        linear
        infinite;

    opacity:.7;

}


@keyframes borderSpin{

    to{
        transform:
            rotate(360deg);
    }

}


/* =========================================================
   CORNERS
========================================================= */

.corner{

    position:absolute;

    width:55px;
    height:55px;

    opacity:.8;

}


.corner::before,
.corner::after{

    content:"";

    position:absolute;

    background:#00ddff;

    box-shadow:
        0 0 12px #00ddff;

}


.corner::before{

    width:100%;
    height:1px;

}


.corner::after{

    width:1px;
    height:100%;

}


.c1{
    top:17px;
    left:17px;
}


.c2{
    top:17px;
    right:17px;
    transform:rotate(90deg);
}


.c3{
    bottom:17px;
    left:17px;
    transform:rotate(-90deg);
}


.c4{
    bottom:17px;
    right:17px;
    transform:rotate(180deg);
}


/* =========================================================
   TOP HUD
========================================================= */

.topHud{

    display:flex;

    align-items:center;

    justify-content:space-between;

    direction:rtl;

    font-size:9px;

    letter-spacing:2px;

    color:
        rgba(180,225,240,.48);

    margin-bottom:10px;

}


.live{

    display:flex;

    align-items:center;

    gap:8px;

}


.liveDot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 8px #00eaff,
        0 0 20px #00eaff;

    animation:
        livePulse
        1.2s
        infinite;

}


@keyframes livePulse{

    50%{

        transform:scale(1.5);

        opacity:.45;

    }

}


/* =========================================================
   3D CORE
========================================================= */

.coreArea{

    position:relative;

    width:300px;
    height:270px;

    margin:
        -10px
        auto
        -5px;

    perspective:1000px;

}


.core{

    position:absolute;

    left:50%;
    top:50%;

    width:105px;
    height:105px;

    border-radius:50%;

    transform:

        translate(-50%,-50%)
        translateZ(100px);

    background:

        radial-gradient(
            circle at 30% 25%,
            white 0%,
            #b5fbff 5%,
            #00eaff 18%,
            #0068ff 42%,
            #07102d 70%,
            #02040a 100%
        );

    box-shadow:

        0 0 18px #00eaff,
        0 0 50px #007cff,
        0 0 100px
        rgba(0,190,255,.7),

        inset 0 0 35px
        #00dfff;

    animation:

        coreFloat
        4s
        ease-in-out
        infinite;

}


@keyframes coreFloat{

    0%,100%{

        transform:
            translate(-50%,-50%)
            translateZ(70px)
            scale(1);

    }

    50%{

        transform:
            translate(-50%,-50%)
            translateZ(120px)
            scale(1.08);

    }

}


/* =========================================================
   ORBITS
========================================================= */

.orbit{

    position:absolute;

    left:50%;
    top:50%;

    border:

        1px solid
        rgba(0,220,255,.5);

    border-radius:50%;

    box-shadow:
        0 0 15px
        rgba(0,220,255,.18);

}


.orbit::after{

    content:"";

    position:absolute;

    width:7px;
    height:7px;

    top:-4px;
    left:50%;

    border-radius:50%;

    background:white;

    box-shadow:

        0 0 10px white,
        0 0 25px #00eaff;

}


.orbit1{

    width:200px;
    height:80px;

    transform:

        translate(-50%,-50%)
        rotateX(70deg)
        rotateZ(20deg);

    animation:
        orbitOne
        6s
        linear
        infinite;

}


.orbit2{

    width:225px;
    height:95px;

    transform:

        translate(-50%,-50%)
        rotateY(65deg)
        rotateZ(-20deg);

    animation:
        orbitTwo
        8s
        linear
        infinite reverse;

}


.orbit3{

    width:250px;
    height:110px;

    transform:

        translate(-50%,-50%)
        rotateX(65deg)
        rotateY(35deg);

    animation:
        orbitThree
        11s
        linear
        infinite;

}


@keyframes orbitOne{

    to{

        transform:

            translate(-50%,-50%)
            rotateX(70deg)
            rotateZ(380deg);

    }

}


@keyframes orbitTwo{

    to{

        transform:

            translate(-50%,-50%)
            rotateY(425deg)
            rotateZ(-20deg);

    }

}


@keyframes orbitThree{

    to{

        transform:

            translate(-50%,-50%)
            rotateX(425deg)
            rotateY(35deg);

    }

}


/* =========================================================
   ENERGY RING
========================================================= */

.energyRing{

    position:absolute;

    left:50%;
    top:50%;

    width:280px;
    height:280px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:

        conic-gradient(
            transparent,
            rgba(0,220,255,.8),
            transparent 13%,
            transparent 55%,
            rgba(130,0,255,.8),
            transparent 72%
        );

    mask:

        radial-gradient(
            transparent 63%,
            #000 64%,
            #000 65%,
            transparent 66%
        );

    animation:
        energySpin
        5s
        linear
        infinite;

}


@keyframes energySpin{

    to{

        transform:
            translate(-50%,-50%)
            rotate(360deg);

    }

}


/* =========================================================
   TITLE
========================================================= */

.title{

    position:relative;

    font-size:
        clamp(
            34px,
            6vw,
            67px
        );

    font-weight:900;

    letter-spacing:1px;

    line-height:1.2;

    margin-bottom:13px;

    color:#f5fdff;

    text-shadow:

        0 0 8px
        rgba(255,255,255,.25),

        0 0 35px
        rgba(0,210,255,.3);

}


.glitch{

    position:relative;

    display:inline-block;

}


.glitch::before,
.glitch::after{

    content:attr(data-text);

    position:absolute;

    inset:0;

    pointer-events:none;

}


.glitch::before{

    color:#00eaff;

    clip-path:
        polygon(
            0 12%,
            100% 12%,
            100% 34%,
            0 34%
        );

    transform:
        translate(-3px);

    animation:
        glitchA
        2.7s
        infinite
        steps(2);

}


.glitch::after{

    color:#a45cff;

    clip-path:
        polygon(
            0 66%,
            100% 66%,
            100% 90%,
            0 90%
        );

    transform:
        translate(3px);

    animation:
        glitchB
        2.2s
        infinite
        steps(2);

}


@keyframes glitchA{

    0%,80%,100%{
        transform:translate(-2px);
    }

    82%{
        transform:
            translate(8px,-2px);
    }

    84%{
        transform:
            translate(-6px,2px);
    }

}


@keyframes glitchB{

    0%,76%,100%{
        transform:translate(2px);
    }

    78%{
        transform:
            translate(-7px,1px);
    }

    80%{
        transform:
            translate(6px,-2px);
    }

}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle{

    color:
        rgba(205,235,245,.52);

    font-size:12px;

    letter-spacing:1px;

    margin-bottom:28px;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress{

    width:min(
        720px,
        90%
    );

    margin:auto;

}


.progressHeader{

    display:flex;

    justify-content:space-between;

    align-items:end;

    margin-bottom:10px;

}


.progressTitle{

    font-size:10px;

    color:
        rgba(175,220,235,.48);

}


.percent{

    font-size:25px;

    font-weight:800;

    color:#a9f6ff;

    text-shadow:

        0 0 10px #00dfff,
        0 0 25px #00dfff;

}


.track{

    height:18px;

    padding:3px;

    border-radius:30px;

    border:
        1px solid
        rgba(0,220,255,.23);

    background:
        rgba(0,0,0,.42);

    box-shadow:

        inset 0 0 18px
        rgba(0,0,0,.8),

        0 0 25px
        rgba(0,190,255,.05);

}


.bar{

    position:relative;

    width:0%;

    height:100%;

    border-radius:30px;

    background:

        repeating-linear-gradient(
            115deg,
            rgba(255,255,255,.2) 0,
            rgba(255,255,255,.2) 8px,
            transparent 8px,
            transparent 20px
        ),

        linear-gradient(
            90deg,
            #006cff,
            #00eaff,
            #945cff
        );

    box-shadow:

        0 0 12px #00dfff,
        0 0 35px
        rgba(0,190,255,.6);

    transition:
        width 1s linear;

}


.bar::after{

    content:"";

    position:absolute;

    right:-5px;

    top:50%;

    width:10px;
    height:10px;

    border-radius:50%;

    transform:
        translateY(-50%);

    background:white;

    box-shadow:

        0 0 10px white,
        0 0 25px #00eaff,
        0 0 50px #00eaff;

}


/* =========================================================
   MINI SYSTEMS
========================================================= */

.systems{

    display:flex;

    justify-content:center;

    gap:35px;

    margin-top:24px;

    font-size:8px;

    color:
        rgba(180,220,235,.4);

}


.system{

    display:flex;

    align-items:center;

    gap:7px;

}


.system i{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 10px #00eaff;

}


/* =========================================================
   TIME
========================================================= */

.time{

    display:flex;

    justify-content:center;

    gap:45px;

    margin-top:24px;

    font-size:9px;

    color:
        rgba(170,215,230,.38);

}


.time span{

    color:#baf5ff;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    margin-top:28px;

    font-size:8px;

    letter-spacing:2px;

    color:
        rgba(160,210,225,.24);

}


.footer strong{

    color:
        rgba(0,220,255,.7);

}


/* =========================================================
   CURSOR
========================================================= */

#cursor{

    position:fixed;

    width:7px;
    height:7px;

    border-radius:50%;

    background:white;

    pointer-events:none;

    z-index:9999;

    transform:
        translate(-50%,-50%);

    box-shadow:

        0 0 8px white,
        0 0 20px #00eaff,
        0 0 40px #00eaff;

}


#cursorRing{

    position:fixed;

    width:34px;
    height:34px;

    border:
        1px solid
        rgba(0,225,255,.6);

    border-radius:50%;

    pointer-events:none;

    z-index:9998;

    transform:
        translate(-50%,-50%);

}


/* =========================================================
   CLICK PARTICLES
========================================================= */

.clickParticle{

    position:fixed;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:

        0 0 10px #00eaff,
        0 0 25px #00eaff;

    pointer-events:none;

    z-index:9999;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

    .panel{

        min-height:auto;

        padding:
            25px
            18px
            30px;

    }

    .coreArea{

        transform:scale(.78);

        margin-top:-30px;
        margin-bottom:-30px;

    }

    .title{

        font-size:33px;

    }

    .subtitle{

        font-size:9px;

    }

    .systems{

        gap:15px;

        flex-wrap:wrap;

    }

    .time{

        gap:12px;

        flex-direction:column;

    }

}

</style>

</head>

        <span class="liveDot"></span>

    </div>

</div>

<div class="coreArea">


    <div class="energyRing"></div>

    <div
    class="orbit orbit2"></div>


    <div
    class="orbit orbit3"></div>


    <div class="core"></div>


</div>


<!-- =================================================

<h1 class="title">


<span

<!-- =================================================

<div class="progress">

</div>


<div
class="percent"
id="percent">

۰٪

</div>


</div>

<div

</div>


</div>


</div>


<!-- =================================================

<div class="systems">


<div class="system">

هسته

</div>


<div class="system">

<i></i>

پایگاه داده

</div>


<div class="system">

<i></i>

شبکه

</div>


<div class="system">

<i></i>

رابط کاربری

</div>


</div>


<!-- =================================================
     TIME

<!-- =====================================================
     CURSOR
===================================================== -->

<div id="cursor"></div>

<div id="cursorRing"></div>


<script>


/* =========================================================
   STAR GENERATOR
========================================================= */

const stars =
document.getElementById("stars");


for(
let i=0;
i<180;
i++
){

    const star =
    document.createElement("div");


    star.className =
    "star";


    star.style.setProperty(
        "--sx",
        (Math.random()*200-100)+"vw"
    );


    star.style.setProperty(
        "--sy",
        (Math.random()*200-100)+"vh"
    );


    star.style.left =
        "50%";


    star.style.top =
        "50%";


    star.style.animationDuration =
        (
            4+
            Math.random()*12
        )+"s";


    star.style.animationDelay =
        (
            -Math.random()*15
        )+"s";


    const size =
        .5+
        Math.random()*2;


    star.style.width =
        size+"px";


    star.style.height =
        size+"px";


    stars.appendChild(star);

}


/* =========================================================
   MOUSE
========================================================= */

const cursor =
document.getElementById(
    "cursor"
);


const cursorRing =
document.getElementById(
    "cursorRing"
);


const mouseLight =
document.getElementById(
    "mouseLight"
);


let mx =
window.innerWidth/2;


let my =
window.innerHeight/2;


let rx=mx;
let ry=my;


document.addEventListener(
"mousemove",
e=>{


    mx=e.clientX;

    my=e.clientY;


    cursor.style.left =
        mx+"px";


    cursor.style.top =
        my+"px";


    mouseLight.style.left =
        mx+"px";


    mouseLight.style.top =
        my+"px";


});


function animateCursor(){


    rx +=
        (mx-rx)*.13;


    ry +=
        (my-ry)*.13;


    cursorRing.style.left =
        rx+"px";


    cursorRing.style.top =
        ry+"px";


    requestAnimationFrame(
        animateCursor
    );

}


animateCursor();


/* =========================================================
   PANEL PARALLAX
========================================================= */

const panel =
document.getElementById(
    "panel"
);


document.addEventListener(
"mousemove",
e=>{


    const x =
        e.clientX /
        window.innerWidth -
        .5;


    const y =
        e.clientY /
        window.innerHeight -
        .5;


    panel.style.transform =

    `
    perspective(1400px)

    rotateX(
        ${y*-4}deg
    )

    rotateY(
        ${x*5}deg
    )
    `;

});


/* =========================================================
   CLICK ENERGY
========================================================= */

document.addEventListener(
"click",
e=>{


    for(
    let i=0;
    i<30;
    i++
    ){


        const p =
        document.createElement(
            "div"
        );


        p.className =
        "clickParticle";


        p.style.left =
        e.clientX+"px";


        p.style.top =
        e.clientY+"px";


        document.body.appendChild(
            p
        );


        const angle =
            Math.random() *
            Math.PI*2;


        const distance =
            40+
            Math.random()*160;


        const x =
            Math.cos(angle)*
            distance;


        const y =
            Math.sin(angle)*
            distance;


        p.animate(

        [

            {

                transform:
                "translate(-50%,-50%) scale(1)",

                opacity:1

            },

            {

                transform:

                `
                translate(
                    calc(-50% + ${x}px),
                    calc(-50% + ${y}px)
                )

                scale(0)
                `,

                opacity:0

            }

        ],

        {

            duration:
                450+
                Math.random()*500,

            easing:
                "cubic-bezier(.15,.8,.3,1)"

        }

        ).onfinish=()=>{

            p.remove();

        };


    }


});


/* =========================================================
   REAL PROGRESS
========================================================= */

const bar =
document.getElementById(
    "bar"
);


const percent =
document.getElementById(
    "percent"
);


const startLabel =
document.getElementById(
    "start"
);


const startTime =
Date.now();


const now =
new Date();


const finish =
new Date(now);


/*

    پایان:
    فردا ساعت ۱۲ ظهر

*/

finish.setDate(
    finish.getDate()+1
);


finish.setHours(
    12,
    0,
    0,
    0
);


/*

    زمان شروع

*/

startLabel.textContent =

new Date(
    startTime
).toLocaleTimeString(
    "fa-IR",
    {
        hour:"2-digit",
        minute:"2-digit"
    }
);


/* =========================================================
   UPDATE
========================================================= */

function updateProgress(){


    const current =
        Date.now();


    const total =
        finish.getTime() -
        startTime;


    const elapsed =
        current -
        startTime;


    let value =
        elapsed /
        total *
        100;


    value =
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        );


    bar.style.width =
        value+"%";


    percent.textContent =

        value
        .toFixed(2)
        .replace(".", "٫")
        +"٪";


}


updateProgress();


setInterval(
    updateProgress,
    1000
);


/* =========================================================
   RANDOM GLITCH
========================================================= */

setInterval(

()=>{


    const glitch =
    document.querySelector(
        ".glitch"
    );


    glitch.style.transform =

    `
    translate(
        ${(Math.random()*8-4)}px,
        ${(Math.random()*4-2)}px
    )
    `;


    setTimeout(
    ()=>{

        glitch.style.transform="";

    },
    90
    );


},

2800

);


/* =========================================================
   CLICK CURSOR EFFECT
========================================================= */

document.addEventListener(
"mousedown",
()=>{

    cursorRing.style.width =
        "55px";

    cursorRing.style.height =
        "55px";

});


document.addEventListener(
"mouseup",
()=>{

    cursorRing.style.width =
        "34px";

    cursorRing.style.height =
        "34px";

});


/* =========================================================
   CORE PULSE
========================================================= */

setInterval(

()=>{


    const core =
    document.querySelector(
        ".core"
    );


    core.style.boxShadow =

    `
    0 0 25px #00eaff,

    0 0 70px #007cff,

    0 0 140px
    rgba(0,220,255,.9),

    inset 0 0 50px #00eaff
    `;


    setTimeout(
    ()=>{

        core.style.boxShadow="";

    },
    350
    );


},

2300

);


</script>


</body>

</html>
