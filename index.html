<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BEHRAD M PLAYER — UPDATE</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#02040a;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
    cursor:none;
}

/* =========================================================
   BACKGROUND
========================================================= */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 48%,rgba(0,180,255,.12),transparent 23%),
        radial-gradient(circle at 20% 20%,rgba(0,80,255,.08),transparent 28%),
        radial-gradient(circle at 80% 80%,rgba(120,0,255,.08),transparent 30%),
        #02040a;
}

.bg::before{
    content:"";
    position:absolute;
    inset:-30%;
    background:
        conic-gradient(
            from 0deg,
            transparent,
            rgba(0,210,255,.05),
            transparent 25%,
            rgba(130,0,255,.04),
            transparent 50%
        );
    animation:backgroundSpin 30s linear infinite;
}

@keyframes backgroundSpin{
    to{transform:rotate(360deg)}
}

/* =========================================================
   STARFIELD
========================================================= */

#stars{
    position:fixed;
    inset:0;
    perspective:900px;
    overflow:hidden;
    z-index:1;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#bcefff;
    box-shadow:0 0 8px #00d9ff;
    animation:starMove linear infinite;
}

@keyframes starMove{
    0%{
        transform:translate3d(
            var(--x),
            var(--y),
            -900px
        ) scale(.1);
        opacity:0;
    }

    15%{
        opacity:.7;
    }

    100%{
        transform:translate3d(
            calc(var(--x) * 1.8),
            calc(var(--y) * 1.8),
            500px
        ) scale(2.5);
        opacity:0;
    }
}

/* =========================================================
   3D GRID
========================================================= */

.grid{
    position:absolute;
    width:180%;
    height:80%;
    left:-40%;
    bottom:-25%;
    transform:
        perspective(500px)
        rotateX(62deg);

    background-image:
        linear-gradient(
            rgba(0,205,255,.09) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,205,255,.09) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    mask-image:
        linear-gradient(
            to top,
            black,
            transparent
        );

    animation:gridScroll 5s linear infinite;
}

@keyframes gridScroll{
    from{
        background-position:0 0;
    }
    to{
        background-position:0 275px;
    }
}

/* =========================================================
   SCANLINES
========================================================= */

.scanlines{
    position:fixed;
    inset:0;
    z-index:40;
    pointer-events:none;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.018) 4px
        );

    mix-blend-mode:screen;
}

.scanner{
    position:fixed;
    z-index:41;
    left:0;
    top:-10%;
    width:100%;
    height:3px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00eaff,
            white,
            #00eaff,
            transparent
        );

    box-shadow:
        0 0 10px #00eaff,
        0 0 30px #00eaff;

    opacity:.35;

    animation:scannerMove 6s linear infinite;
}

@keyframes scannerMove{
    to{top:110%}
}

/* =========================================================
   MOUSE LIGHT
========================================================= */

#mouseLight{
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    pointer-events:none;
    z-index:2;

    background:
        radial-gradient(
            circle,
            rgba(0,220,255,.09),
            rgba(0,100,255,.035) 30%,
            transparent 70%
        );

    transform:translate(-50%,-50%);
    filter:blur(10px);
}

/* =========================================================
   MAIN
========================================================= */

.main{
    position:relative;
    z-index:10;
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

/* =========================================================
   3D PANEL
========================================================= */

.panel{
    position:relative;
    width:min(1000px,95vw);
    min-height:610px;

    padding:50px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.018)
        );

    border:
        1px solid rgba(0,220,255,.22);

    backdrop-filter:
        blur(24px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(24px)
        saturate(140%);

    box-shadow:
        0 30px 120px rgba(0,0,0,.65),
        0 0 80px rgba(0,170,255,.07),
        inset 0 0 80px rgba(0,200,255,.025);

    transform-style:preserve-3d;

    transition:
        transform .15s ease-out;
}

/* animated border */

.panel::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:31px;

    background:
        conic-gradient(
            from 0deg,
            transparent,
            #00eaff,
            transparent 18%,
            transparent 55%,
            #8b5cff,
            transparent 75%
        );

    mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    mask-composite:exclude;

    padding:1px;

    animation:borderRotate 7s linear infinite;

    opacity:.8;
}

@keyframes borderRotate{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   CORNERS
========================================================= */

.corner{
    position:absolute;
    width:55px;
    height:55px;
    opacity:.8;
}

.corner::before,
.corner::after{
    content:"";
    position:absolute;
    background:#00ddff;
    box-shadow:0 0 12px #00ddff;
}

.corner::before{
    width:100%;
    height:1px;
}

.corner::after{
    width:1px;
    height:100%;
}

.c1{top:18px;left:18px}
.c2{
    top:18px;
    right:18px;
    transform:rotate(90deg)
}
.c3{
    bottom:18px;
    left:18px;
    transform:rotate(-90deg)
}
.c4{
    bottom:18px;
    right:18px;
    transform:rotate(180deg)
}

/* =========================================================
   HUD TOP
========================================================= */

.hud{
    display:flex;
    justify-content:space-between;
    align-items:center;

    font-family:Orbitron,sans-serif;
    font-size:9px;
    letter-spacing:3px;
    color:rgba(170,225,240,.55);

    margin-bottom:30px;
}

.live{
    display:flex;
    align-items:center;
    gap:8px;
}

.liveDot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#00eaff;
    box-shadow:
        0 0 7px #00eaff,
        0 0 20px #00eaff;

    animation:livePulse 1s infinite;
}

@keyframes livePulse{
    50%{
        transform:scale(1.6);
        opacity:.5;
    }
}

/* =========================================================
   CONTENT
========================================================= */

.content{
    position:relative;
    z-index:5;
    text-align:center;
}

/* =========================================================
   3D CORE
========================================================= */

.coreWrap{
    position:relative;
    width:260px;
    height:260px;
    margin:-20px auto 20px;

    perspective:1000px;
}

.core{
    position:absolute;
    left:50%;
    top:50%;

    width:110px;
    height:110px;

    transform:
        translate(-50%,-50%)
        translateZ(80px);

    transform-style:preserve-3d;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            white 0,
            #8df5ff 5%,
            #00dfff 18%,
            #006eff 42%,
            #080b25 70%,
            #02040a 100%
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px #007bff,
        0 0 90px rgba(0,180,255,.7),
        inset 0 0 35px #00dfff;

    animation:
        coreFloat 4s ease-in-out infinite,
        coreSpin 12s linear infinite;
}

@keyframes coreFloat{
    0%,100%{
        transform:
            translate(-50%,-50%)
            translateZ(70px)
            scale(1);
    }

    50%{
        transform:
            translate(-50%,-50%)
            translateZ(110px)
            scale(1.08);
    }
}

@keyframes coreSpin{
    to{
        filter:
            hue-rotate(360deg);
    }
}

/* orbit rings */

.orbit{
    position:absolute;
    left:50%;
    top:50%;

    border:
        1px solid rgba(0,220,255,.5);

    border-radius:50%;

    transform-style:preserve-3d;

    box-shadow:
        0 0 15px rgba(0,220,255,.15);
}

.orbit::after{
    content:"";
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;

    top:-4px;
    left:50%;

    background:#fff;

    box-shadow:
        0 0 10px #fff,
        0 0 25px #00eaff;
}

.o1{
    width:190px;
    height:75px;
    transform:
        translate(-50%,-50%)
        rotateX(70deg)
        rotateZ(20deg);

    animation:orbit1 6s linear infinite;
}

.o2{
    width:220px;
    height:90px;
    transform:
        translate(-50%,-50%)
        rotateY(65deg)
        rotateZ(-20deg);

    animation:orbit2 8s linear infinite reverse;
}

.o3{
    width:245px;
    height:105px;
    transform:
        translate(-50%,-50%)
        rotateX(65deg)
        rotateY(35deg);

    animation:orbit3 11s linear infinite;
}

@keyframes orbit1{
    to{
        transform:
            translate(-50%,-50%)
            rotateX(70deg)
            rotateZ(380deg);
    }
}

@keyframes orbit2{
    to{
        transform:
            translate(-50%,-50%)
            rotateY(425deg)
            rotateZ(-20deg);
    }
}

@keyframes orbit3{
    to{
        transform:
            translate(-50%,-50%)
            rotateX(425deg)
            rotateY(35deg);
    }
}

/* energy rings */

.energy{
    position:absolute;
    left:50%;
    top:50%;

    width:280px;
    height:280px;

    border-radius:50%;

    transform:
        translate(-50%,-50%);

    background:
        conic-gradient(
            transparent,
            rgba(0,220,255,.7),
            transparent 15%,
            transparent 55%,
            rgba(130,0,255,.7),
            transparent 70%
        );

    mask:
        radial-gradient(
            transparent 63%,
            #000 64%,
            #000 65%,
            transparent 66%
        );

    animation:energySpin 5s linear infinite;
}

@keyframes energySpin{
    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}

/* =========================================================
   TITLE
========================================================= */

.title{
    position:relative;

    font-family:Orbitron,sans-serif;
    font-weight:900;

    font-size:
        clamp(35px,6vw,72px);

    letter-spacing:5px;

    line-height:1;

    margin-bottom:20px;

    color:#f5fdff;

    text-shadow:
        0 0 8px rgba(255,255,255,.3),
        0 0 35px rgba(0,200,255,.3);
}

/* glitch layers */

.glitch{
    position:relative;
    display:inline-block;
}

.glitch::before,
.glitch::after{
    content:attr(data-text);
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;

    pointer-events:none;
}

.glitch::before{
    color:#00eaff;

    clip-path:
        polygon(
            0 10%,
            100% 10%,
            100% 35%,
            0 35%
        );

    transform:translate(-3px);

    animation:
        glitchA 2.7s infinite steps(2);
}

.glitch::after{
    color:#a05cff;

    clip-path:
        polygon(
            0 65%,
            100% 65%,
            100% 90%,
            0 90%
        );

    transform:translate(3px);

    animation:
        glitchB 2.2s infinite steps(2);
}

@keyframes glitchA{
    0%,80%,100%{transform:translate(-2px)}
    82%{transform:translate(8px,-2px)}
    84%{transform:translate(-6px,2px)}
    86%{transform:translate(1px)}
}

@keyframes glitchB{
    0%,76%,100%{transform:translate(2px)}
    78%{transform:translate(-7px,1px)}
    80%{transform:translate(6px,-2px)}
    82%{transform:translate(0)}
}

/* =========================================================
   SUBTITLE
========================================================= */

.subtitle{
    color:rgba(200,235,245,.55);
    font-size:11px;
    letter-spacing:6px;
    text-transform:uppercase;
    margin-bottom:35px;
}

/* =========================================================
   PROGRESS
========================================================= */

.progressBox{
    width:min(700px,90%);
    margin:auto;
}

.progressTop{
    display:flex;
    justify-content:space-between;
    align-items:end;

    margin-bottom:12px;
}

.progressName{
    font-family:Orbitron,sans-serif;
    font-size:10px;
    letter-spacing:3px;
    color:#91c9d8;
}

.percent{
    font-family:Orbitron,sans-serif;
    font-size:26px;
    font-weight:800;
    color:#a5f5ff;

    text-shadow:
        0 0 10px #00dfff,
        0 0 25px rgba(0,210,255,.6);
}

/* bar */

.track{
    position:relative;

    height:20px;

    padding:3px;

    border-radius:30px;

    border:
        1px solid rgba(0,220,255,.22);

    background:
        rgba(0,0,0,.4);

    box-shadow:
        inset 0 0 20px rgba(0,0,0,.7),
        0 0 30px rgba(0,180,255,.05);
}

.bar{
    position:relative;

    width:0%;
    height:100%;

    border-radius:30px;

    overflow:visible;

    background:
        repeating-linear-gradient(
            115deg,
            rgba(255,255,255,.2) 0,
            rgba(255,255,255,.2) 8px,
            transparent 8px,
            transparent 20px
        ),
        linear-gradient(
            90deg,
            #006dff,
            #00dfff,
            #8b5cff
        );

    box-shadow:
        0 0 12px #00dfff,
        0 0 30px rgba(0,190,255,.7),
        0 0 60px rgba(0,120,255,.35);

    transition:width 1s linear;

    animation:barMove 1.2s linear infinite;
}

@keyframes barMove{
    to{
        background-position:
            20px 0,
            0 0;
    }
}

.bar::after{
    content:"";

    position:absolute;

    right:-5px;
    top:50%;

    width:10px;
    height:10px;

    border-radius:50%;

    transform:translateY(-50%);

    background:#fff;

    box-shadow:
        0 0 10px white,
        0 0 25px #00eaff,
        0 0 50px #00eaff;
}

/* =========================================================
   SYSTEM HUD
========================================================= */

.systems{
    display:flex;
    justify-content:center;
    gap:45px;

    margin-top:28px;

    color:rgba(180,220,235,.4);

    font-family:Orbitron,sans-serif;
    font-size:8px;
    letter-spacing:2px;
}

.system{
    display:flex;
    align-items:center;
    gap:7px;
}

.system i{
    display:block;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:0 0 10px #00eaff;
}

/* =========================================================
   TIME
========================================================= */

.time{
    margin-top:27px;

    display:flex;
    justify-content:center;
    gap:40px;

    font-family:Orbitron,sans-serif;
    font-size:8px;

    letter-spacing:2px;

    color:rgba(170,210,225,.4);
}

.time span{
    color:#b8f4ff;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
    margin-top:32px;

    font-family:Orbitron,sans-serif;
    font-size:8px;
    letter-spacing:4px;

    color:rgba(160,210,225,.25);
}

.footer strong{
    color:rgba(0,220,255,.7);
}

/* =========================================================
   MOUSE CURSOR
========================================================= */

#cursor{
    position:fixed;

    width:7px;
    height:7px;

    border-radius:50%;

    background:white;

    pointer-events:none;

    z-index:9999;

    transform:translate(-50%,-50%);

    box-shadow:
        0 0 8px white,
        0 0 20px #00eaff,
        0 0 40px #00eaff;
}

#cursorRing{
    position:fixed;

    width:34px;
    height:34px;

    border-radius:50%;

    border:1px solid rgba(0,225,255,.65);

    pointer-events:none;

    z-index:9998;

    transform:translate(-50%,-50%);

    transition:
        width .2s,
        height .2s;
}

/* =========================================================
   CLICK PARTICLES
========================================================= */

.clickParticle{
    position:fixed;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 10px #00eaff,
        0 0 20px #00eaff;

    pointer-events:none;

    z-index:9999;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

    .panel{
        min-height:auto;
        padding:30px 20px 35px;
    }

    .coreWrap{
        transform:scale(.78);
        margin-top:-35px;
        margin-bottom:-25px;
    }

    .title{
        font-size:34px;
        letter-spacing:2px;
    }

    .subtitle{
        font-size:8px;
        letter-spacing:3px;
    }

    .systems{
        gap:15px;
        flex-wrap:wrap;
    }

    .time{
        gap:15px;
        flex-direction:column;
    }

    .hud{
        font-size:7px;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="bg">

    <div id="stars"></div>

    <div class="grid"></div>

</div>

<div id="mouseLight"></div>

<div class="scanlines"></div>
<div class="scanner"></div>

<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">

    <section class="panel" id="panel">

        <div class="corner c1"></div>
        <div class="corner c2"></div>
        <div class="corner c3"></div>
        <div class="corner c4"></div>

        <div class="hud">

            <div>
                BEHRAD M PLAYER // SYSTEM
            </div>

            <div class="live">

                <span class="liveDot"></span>

                SYSTEM ONLINE

            </div>

        </div>


        <div class="content">

            <!-- =================================================
                 3D CORE
            ================================================== -->

            <div class="coreWrap">

                <div class="energy"></div>

                <div class="orbit o1"></div>
                <div class="orbit o2"></div>
                <div class="orbit o3"></div>

                <div class="core"></div>

            </div>


            <!-- =================================================
                 TITLE
            ================================================== -->

            <h1 class="title">

                <span
                    class="glitch"
                    data-text="WE ARE UPDATING">

                    WE ARE UPDATING

                </span>

            </h1>


            <div class="subtitle">

                A new experience is being assembled

            </div>


            <!-- =================================================
                 PROGRESS
            ================================================== -->

            <div class="progressBox">

                <div class="progressTop">

                    <div class="progressName">

                        WEBSITE UPDATE

                    </div>

                    <div
                        class="percent"
                        id="percent">

                        0%

                    </div>

                </div>


                <div class="track">

                    <div
                        class="bar"
                        id="bar">

                    </div>

                </div>

            </div>


            <!-- =================================================
                 SYSTEMS
            ================================================== -->

            <div class="systems">

                <div class="system">
                    <i></i>
                    CORE
                </div>

                <div class="system">
                    <i></i>
                    DATABASE
                </div>

                <div class="system">
                    <i></i>
                    NETWORK
                </div>

                <div class="system">
                    <i></i>
                    UI
                </div>

            </div>


            <!-- =================================================
                 TIME
            ================================================== -->

            <div class="time">

                <div>
                    START:
                    <span id="start"></span>
                </div>

                <div>
                    ETA:
                    <span>TOMORROW 12:00</span>
                </div>

            </div>


            <div class="footer">

                POWERED BY
                <strong>BEHRAD M PLAYER</strong>

            </div>

        </div>

    </section>

</main>


<div id="cursor"></div>
<div id="cursorRing"></div>


<script>

/* =========================================================
   STARFIELD
========================================================= */

const stars =
    document.getElementById("stars");

for(let i=0;i<160;i++){

    const star =
        document.createElement("div");

    star.className="star";

    const x =
        (Math.random()*200-100);

    const y =
        (Math.random()*200-100);

    star.style.setProperty(
        "--x",
        x+"vw"
    );

    star.style.setProperty(
        "--y",
        y+"vh"
    );

    star.style.left =
        (50+Math.random()*2-1)+"%";

    star.style.top =
        (50+Math.random()*2-1)+"%";

    star.style.animationDuration =
        (4+Math.random()*10)+"s";

    star.style.animationDelay =
        (-Math.random()*12)+"s";

    const size =
        Math.random()*2.5+.5;

    star.style.width =
        size+"px";

    star.style.height =
        size+"px";

    stars.appendChild(star);
}


/* =========================================================
   MOUSE
========================================================= */

const cursor =
    document.getElementById("cursor");

const cursorRing =
    document.getElementById("cursorRing");

const mouseLight =
    document.getElementById("mouseLight");

let mx =
    window.innerWidth/2;

let my =
    window.innerHeight/2;

let rx=mx;
let ry=my;

document.addEventListener(
    "mousemove",
    e=>{

        mx=e.clientX;
        my=e.clientY;

        cursor.style.left=mx+"px";
        cursor.style.top=my+"px";

        mouseLight.style.left=mx+"px";
        mouseLight.style.top=my+"px";

    }
);


function cursorAnimation(){

    rx +=
        (mx-rx)*.13;

    ry +=
        (my-ry)*.13;

    cursorRing.style.left =
        rx+"px";

    cursorRing.style.top =
        ry+"px";

    requestAnimationFrame(
        cursorAnimation
    );
}

cursorAnimation();


/* =========================================================
   PANEL 3D TILT
========================================================= */

const panel =
    document.getElementById("panel");

document.addEventListener(
    "mousemove",
    e=>{

        const x =
            e.clientX /

document.addEventListener(

                    },
                    {

                                calc(-50% + ${y}px)
                            )
                            scale(0)
                            `,
                        opacity:0
                    }
                ],
                {
                    duration:
                        450+

                }

/* =========================================================
   PROGRESS SYSTEM
========================================================= */

/*
    شروع:
    لحظه‌ای که صفحه برای اولین بار باز می‌شود.

    پایان:
    فردا ساعت 12 ظهر.

    درصد واقعی از زمان محاسبه می‌شود.
*/

const progressBar =
    document.getElementById("bar");

const percent =
    document.getElementById("percent");

const startLabel =
    document.getElementById("start");


const startTime =
    Date.now();

const now =
    new Date();

const finish =
    new Date(now);


/*
    مقصد = فردا ساعت 12
*/

finish.setDate(
    finish.getDate()+1
);

finish.setHours(
    12,
    0,
    0,
    0
);


/*
    اگر به هر دلیلی مقصد گذشته بود،
    یک روز دیگر اضافه می‌کنیم.
*/

if(
    finish.getTime() <=
    startTime
){

    finish.setDate(
        finish.getDate()+1
    );

}


/* نمایش زمان شروع */

startLabel.textContent =
    new Date(
        startTime
    ).toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );


function updateProgress(){

    const current =
        Date.now();

    const total =
        finish.getTime() -
        startTime;

    const elapsed =
        current -
        startTime;

    let value =
        elapsed /
        total *
        100;

    value =
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        );

    progressBar.style.width =
        value+"%";

    percent.textContent =
        value.toFixed(2)+"%";

}


updateProgress();

setInterval(
    updateProgress,
    1000
);
